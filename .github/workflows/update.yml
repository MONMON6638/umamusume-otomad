name: update

on:
  schedule:
    - cron: "0 0 * * *" # 毎日 9時（日本時間）。ニコ動の検索 API のデータ更新（実際は 7時ごろ）の後
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # データのコミットだけに使う
    steps:
      # 前の実行が積んだデータのコミットも含めて、始まった時点の main の最新を使う
      # （手動実行などは押した時点のコミットで動くので、そのままだと push がぶつかる）
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      # exclude.json・ng-tags.json が壊れていたら公開しない（除外が外れた一覧を出さないため）
      - name: Check exclude.json and ng-tags.json
        run: node -e "for (const f of ['exclude.json','ng-tags.json']) JSON.parse(require('fs').readFileSync(f,'utf8'))"

      # 取得に失敗しても前回のデータで公開は続ける（失敗は警告として残る）
      - name: Fetch videos
        run: npm run fetch
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      # GITHUB_TOKEN による push は次のワークフローを起動しないので、ループにはならない
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "data: 動画一覧を更新"
            # 取得中に人が push していても失敗しないよう、最新を取り込んでから push する。
            # data/videos.json がぶつかったときは、今回取得したほうを使う
            git pull --rebase -X theirs origin main
            git push
          fi

      - run: npm run build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
