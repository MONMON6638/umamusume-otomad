<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ニコニコ動画と YouTube のウマ娘音MADをまとめて探せるサイト" />
    <title>ウマ娘 音MAD まとめ</title>
  </head>
  <body>
    <header class="bar">
      <h1 class="logo">ウマ娘 音MAD まとめ</h1>
      <div class="controls">
        <input id="q" type="search" placeholder="タイトル・キャラ・タグで検索" aria-label="キーワード検索" />
        <input id="chara" list="chara-list" placeholder="キャラで絞り込み" aria-label="キャラで絞り込み" />
        <datalist id="chara-list"></datalist>
        <input id="author" list="author-list" placeholder="投稿者で絞り込み" aria-label="投稿者で絞り込み" />
        <datalist id="author-list"></datalist>
        <select id="src" aria-label="取得元">
          <option value="all">すべて</option>
          <option value="nico">ニコ動</option>
          <option value="youtube">YouTube</option>
        </select>
        <select id="sort" aria-label="並び順">
          <option value="new">新着順</option>
          <option value="views">再生数順</option>
          <option value="likes">いいね数順</option>
        </select>
      </div>
    </header>

    <main>
      <p id="count" class="count"></p>
      <div id="grid" class="grid"></div>
      <p id="empty" class="empty" hidden>見つかりませんでした</p>
      <button id="more" class="more" type="button" hidden>もっと見る</button>
    </main>

    <footer class="footer">
      <p>各動画の権利は投稿者に帰属します。</p>
      <p>
        <span id="updated"></span>
        <a id="issues" target="_blank" rel="noopener" hidden>掲載の取り下げ依頼</a>
      </p>
    </footer>

    <dialog id="player" class="player">
      <div class="player-head">
        <p id="player-title" class="player-title"></p>
        <button id="player-close" class="player-close" type="button" aria-label="閉じる">✕</button>
      </div>
      <div id="player-frame" class="player-frame"></div>
      <div class="player-foot">
        <a id="player-link" class="player-link" target="_blank" rel="noopener">元のページで見る ↗</a>
        <button id="player-author" class="player-author" type="button" hidden></button>
      </div>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
